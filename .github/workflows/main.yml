name: Build Bengal Joddha 1 Web & APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Extract game.zip
        run: |
          if [ -f game.zip ]; then
            unzip -o game.zip -d .
          fi

      - name: Install dependencies and build web
        run: |
          PKG=$(find . -maxdepth 5 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG" ]; then
            echo "package.json not found! Current files:"
            ls -la
            exit 1
          fi
          SUBDIR=$(dirname "$PKG")
          echo "Using project directory: $SUBDIR"
          cd "$SUBDIR"
          npm install
          npm run build

      - name: Configure and build Android APK
        run: |
          PKG=$(find . -maxdepth 5 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          SUBDIR=$(dirname "$PKG")
          cd "$SUBDIR"
          # প্রয়োজন অনুযায়ী appId ও অ্যাপের নাম আলাদা রাখুন যেন পুরোনো অ্যাপের সাথে কনফ্লিক্ট না হয়
          npx cap init "Bengal Joddha 1" "com.bengaljoddha.one" --web-dir=dist || true
          npx cap add android || true
          npx cap copy android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bengal-joddha-1-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
